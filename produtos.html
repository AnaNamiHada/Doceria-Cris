<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍰 Produtos - Doceria Artesanal</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="/">🍰 Doceria</a>
                </div>
                <nav class="nav">
                    <a href="/">Início</a>
                    <a href="/produtos.html" class="active">Produtos</a>
                    <a href="/cadastro.html">Cadastrar</a>
                    <a href="/about.html">Sobre</a>
                </nav>
                <div class="header-actions">
                    <button id="cartBtn" class="cart-btn">
                        🛒 <span id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- PRODUTOS -->
    <section class="products-section">
        <div class="container">
            <h1 class="section-title">🍰 Todos os Produtos</h1>
            
            <div class="filters-container">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Buscar produtos..."
                    />
                </div>
                <div class="filters">
                    <select id="categoryFilter">
                        <option value="">Todas categorias</option>
                    </select>
                    <select id="sortFilter">
                        <option value="nome">Ordenar por Nome</option>
                        <option value="preco">Ordenar por Preço</option>
                        <option value="avaliacao">Ordenar por Avaliação</option>
                    </select>
                    <button id="clearFilters" class="btn-clear">Limpar Filtros</button>
                </div>
            </div>

            <div id="productsContainer" class="product-grid">
                <!-- Carregado via JavaScript -->
            </div>

            <div id="pagination" class="pagination">
                <!-- Carregado via JavaScript -->
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>🍰 Doceria Artesanal &copy; 2026 - Feito com ❤️</p>
        </div>
    </footer>

    <!-- MODAL CARRINHO -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>🛒 Seu Carrinho</h2>
            <div id="cartItems" class="cart-items">
                <p class="empty-cart">Seu carrinho está vazio</p>
            </div>
            <div class="cart-total">
                <strong>Total:</strong> <span id="cartTotal">R$ 0,00</span>
            </div>
            <button id="checkoutBtn" class="btn-primary">Finalizar Pedido</button>
        </div>
    </div>

    <!-- MODAL PRODUTO -->
    <div id="productModal" class="modal">
        <div class="modal-content modal-product">
            <span class="modal-close">&times;</span>
            <div id="productDetailContent">
                <!-- Carregado via JavaScript -->
            </div>
        </div>
    </div>

    <script src="js/utils/formatters.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/ProductCard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
